<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PowerLock Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PowerLock "Ion" design tokens (mirrors PowerLock/Design/Tokens.swift). Dark only. */
:root{
  --bg:#000; --surface:#0F1013; --sunken:#1A1B20; --track:#1D1E24; --hair:rgba(255,255,255,.08);
  --accent:#2F6FEB; --glow:#8DB0F4; --wash:rgba(47,111,235,.16);
  --label:#F4F5F7; --sec:#8E939C; --ter:#575B63; --danger:#FF5A52;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#050607;color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Page layout: screen list + phone ---------- */
.stage{display:flex;height:100%;align-items:center;justify-content:center;gap:56px;padding:24px}
.side{width:280px;max-height:calc(100vh - 48px);overflow:auto;padding-right:6px}
.side h1{font-size:22px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.side p.lead{color:var(--sec);font-size:13px;line-height:1.45;margin:0 0 18px}
.side h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ter);font-weight:600;margin:18px 0 6px}
.side .nav{display:flex;flex-direction:column;gap:1px}
.side .nav button{font-size:14px;color:var(--sec);padding:6px 10px;border-radius:8px}
.side .nav button:hover{background:var(--surface);color:var(--label)}
.side .nav button.on{background:var(--wash);color:var(--glow)}
.side .tip{font-size:12px;color:var(--ter);line-height:1.5;margin-top:18px}
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 48px);border-radius:56px;background:var(--bg);
  box-shadow:0 0 0 11px #121316,0 0 0 12px #2a2c31,0 40px 120px rgba(0,0,0,.6);overflow:hidden;flex:none}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-size:17px;font-weight:600;z-index:55;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);z-index:80;pointer-events:none}
#app{position:absolute;inset:0}
.menu-btn{display:none}
@media (max-width:760px){
  .stage{padding:0;gap:0}
  .side{display:none;position:fixed;inset:0;width:auto;max-height:none;background:rgba(0,0,0,.94);z-index:200;padding:56px 22px 40px;backdrop-filter:blur(10px)}
  .side.open{display:block}
  .phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
  .island,.status,.homebar{display:none}
  .menu-btn{display:flex;position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:150;align-items:center;gap:6px;
    font-size:12px;font-weight:600;color:var(--sec);background:rgba(26,27,32,.9);border:1px solid var(--hair);border-radius:99px;padding:7px 12px}
  .side .close{display:block}
}
.side .close{display:none;position:absolute;top:14px;right:16px;font-size:15px;color:var(--glow)}

/* ---------- Screen scaffolding ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad-top{height:58px;flex:none}
@media (max-width:760px){.pad-top{height:calc(env(safe-area-inset-top) + 12px)}}
.foot{flex:none;padding:12px 20px 34px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000 22%)}
.foot .note{text-align:center;color:var(--sec);font-size:13px;margin-top:10px;line-height:1.4}

/* type */
.t-display{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px;margin:0}
.t-title{font-size:28px;line-height:34px;font-weight:600;margin:0}
.t-heading{font-size:20px;line-height:25px;font-weight:600;margin:0}
.t-head{font-size:17px;line-height:22px;font-weight:600}
.t-sub{font-size:15px;line-height:20px;color:var(--sec)}
.t-foot{font-size:13px;line-height:18px;color:var(--sec)}
.over{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--sec)}
.stat{font-weight:200;font-size:34px;line-height:40px;font-variant-numeric:tabular-nums}
.glow{color:var(--glow)} .sec{color:var(--sec)} .ter{color:var(--ter)}

/* components */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-l);padding:20px}
.group{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-l);overflow:hidden}
.hair{height:1px;background:var(--hair)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:99px;font-size:17px;font-weight:600;text-align:center;padding:0 16px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.primary{background:var(--accent);color:#fff}
.btn.secondary{background:var(--sunken);color:var(--label)}
.btn.onaccent{background:#fff;color:var(--accent)}
.btn.quiet{min-height:44px;color:var(--glow)}
.btn.danger{min-height:44px;color:var(--danger)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary:disabled{background:#1d3f86;opacity:1;color:rgba(255,255,255,.55)}
.icotile{width:36px;height:36px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:16px;flex:none}
.icotile.wash{background:var(--wash);color:var(--glow)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--sunken);color:var(--sec)}
.pill.accent{background:var(--accent);color:#fff}
.pill.glow{background:var(--wash);color:var(--glow)}
.mark{width:24px;height:24px;flex:none;border-radius:50%;border:1.6px solid var(--ter);display:grid;place-items:center}
.mark.on{background:var(--accent);border-color:var(--accent);color:#fff;font-size:14px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;min-height:60px;position:relative}
.opt + .opt::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--hair)}
.opt.has-ic + .opt.has-ic::before{left:62px}
.opt.sel{background:var(--wash)}
.opt .oic{width:28px;font-size:20px;color:var(--sec);display:grid;place-items:center}
.opt.sel .oic{color:var(--glow)}
.opt .otx{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .otx b{font-size:17px;font-weight:600;line-height:22px}
.opt .otx small{font-size:15px;color:var(--sec);line-height:20px}
.chips{display:flex;gap:8px}
.chips button{flex:1;min-height:48px;border-radius:99px;background:var(--sunken);font-size:17px;font-weight:600;text-align:center}
.chips button.on{background:var(--accent);color:#fff}
.stack{display:flex;flex-direction:column}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.toggle{width:51px;height:31px;border-radius:99px;background:#39393d;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--accent)} .toggle.on::after{transform:translateX(20px)}
.toast{position:absolute;left:20px;right:20px;bottom:110px;z-index:120;background:rgba(26,27,32,.96);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.4;color:var(--label);animation:toast 2.6s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}

/* onboarding header */
.onb-head{display:flex;align-items:center;gap:14px;height:44px;padding:0 20px;flex:none}
.onb-head .back{width:28px;height:44px;display:grid;place-items:center;color:var(--glow);font-size:22px;margin-left:-4px}
.prog{flex:1;height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin:0 24px 0 8px}
.prog i{display:block;height:100%;background:var(--glow);border-radius:99px;transition:width .35s ease}
.pagetitle{margin:16px 0 20px}
.pagetitle h1{font-size:28px;line-height:34px;font-weight:600;margin:0}
.pagetitle p{font-size:17px;line-height:22px;color:var(--sec);margin:6px 0 0}

/* Today */
.topbar{display:flex;justify-content:flex-end;height:44px;align-items:center}
.circlebtn{width:44px;height:44px;border-radius:50%;background:var(--sunken);border:1px solid var(--hair);display:grid;place-items:center;font-size:20px}
.hero{border-radius:var(--r-xl);padding:20px}
.hero.blue{background:var(--accent);border:0}
.hero.blue .sec{color:rgba(255,255,255,.82)}
.hero.blue .hair{background:rgba(255,255,255,.28)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0}
.stat3 > div{padding:0 0 0 0;display:flex;flex-direction:column;gap:2px}
.stat3 > div + div{border-left:1px solid var(--hair);padding-left:12px}
.stat3 .v{font-size:28px;font-weight:300;line-height:34px;font-variant-numeric:tabular-nums}
.stat3 .l{font-size:13px;color:var(--sec)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center;gap:4px;margin-top:14px}
.weekstrip span{font-size:12px;color:var(--sec);font-weight:500;margin-top:6px}
.weekstrip span.today{color:var(--label);font-weight:700}
.stat2{display:grid;grid-template-columns:1fr 1fr;padding:6px 4px}
.stat2 > div + div{border-left:1px solid var(--hair);padding-left:18px}
.stat2 .v{font-size:34px;font-weight:200;line-height:42px}
.stat2 .v small{font-size:20px;color:var(--sec);font-weight:300}
.stat2 .l{font-size:13px;color:var(--sec)}
.tabbar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:99px;
  background:rgba(22,23,27,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);z-index:40}
.tabbar button{width:92px;height:56px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--label)}
.tabbar button svg{font-size:22px}
.tabbar button.on{background:rgba(255,255,255,.1);color:var(--glow)}
.fade-bottom{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000 70%);pointer-events:none;z-index:30}
.secthead{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}
.secthead button{font-size:15px;color:var(--glow)}

/* lists */
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;width:100%}
.lrow + .lrow::before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;height:1px;background:var(--hair)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:17px;font-weight:600;line-height:22px}
.lrow .tx small{display:block;font-size:15px;color:var(--sec);line-height:20px}
.lrow .chev{color:var(--ter);font-size:15px}
.numdot{width:28px;height:28px;border-radius:50%;background:var(--wash);color:var(--glow);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none}
.daypill{width:48px;text-align:center;font-size:13px;font-weight:600;padding:5px 0;border-radius:99px;background:var(--sunken);color:var(--sec);flex:none}
.daypill.on{background:var(--wash);color:var(--glow)}

/* session */
.navbar{display:flex;align-items:center;height:52px;padding:0 16px;flex:none;position:relative}
.navbar .ttl{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.navbar .back{width:44px;height:44px;border-radius:50%;background:var(--sunken);border:1px solid var(--hair);display:grid;place-items:center;font-size:20px;z-index:1}
.navbar .pillbtn{padding:0 16px;height:40px;border-radius:99px;background:var(--sunken);border:1px solid var(--hair);font-size:17px;color:var(--glow);z-index:1}
.navbar .pillbtn.r{margin-left:auto;font-weight:600}
.ringwrap{position:relative;width:300px;height:300px;margin:8px auto 0}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .clock{font-size:76px;font-weight:100;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.verified-disc{position:absolute;inset:26px;border-radius:50%;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.exrow{display:flex;gap:14px;align-items:center;padding:12px 16px;position:relative;width:100%}
.exrow + .exrow::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--hair)}
.exrow b{font-size:17px;font-weight:600;display:block}
.exrow.done b{text-decoration:line-through;color:var(--sec)}
.exrow small{font-size:13px;color:var(--sec)}

/* sheets */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:90;animation:fade .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;top:12px;background:#0b0c0e;border-radius:28px 28px 0 0;z-index:91;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.3,1);border-top:1px solid var(--hair)}
@media (min-width:761px){.sheet{top:50px}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.grabber{width:36px;height:5px;border-radius:3px;background:#3a3b40;margin:6px auto 0}
.textbox{width:100%;min-height:96px;resize:none;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-m);padding:14px 16px;font-size:17px;outline:none}
.textbox:focus{border-color:var(--accent)}
.textbox::placeholder{color:var(--ter)}
.timepill{background:var(--sunken);border:0;border-radius:99px;padding:8px 14px;font-size:17px;color:var(--label);font-variant-numeric:tabular-nums;color-scheme:dark}
.setgroup-title{font-size:20px;font-weight:600;margin:22px 4px 10px}
.setnote{font-size:13px;color:var(--sec);line-height:18px;margin:8px 16px 0}
.srow{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:54px;position:relative;width:100%}
.srow + .srow::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;background:var(--hair)}
.srow .sic{width:26px;font-size:20px;display:grid;place-items:center}
.srow .lbl{flex:1;font-size:17px}
.srow .val{color:var(--sec);font-size:17px;display:flex;align-items:center;gap:6px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;justify-items:center;margin-top:14px}
.cal .h{font-size:12px;color:var(--sec);font-weight:500}
.cal .d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--sec)}
.cal .d.train{background:#121318;border:1px solid var(--hair);color:var(--label)}
.cal .d.ver{background:var(--accent);color:#fff;border:0}
.cal .d.em{border:1.5px dashed var(--glow);color:var(--label);background:none}
.cal .d.today{border:2px solid var(--glow);color:var(--label);font-weight:600}
.legend{display:flex;gap:18px;font-size:13px;color:var(--sec);margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* calculating */
.calc{background:linear-gradient(to bottom,#000 30%,#0f2350)}
.typing{animation:fade .4s}
.map{height:176px;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--hair);position:relative;background:#1c2233}
.brandtile{display:grid;place-items:center;background:var(--accent)}
</style>
</head>
<body>
<div class="stage">
  <aside class="side" id="side">
    <button class="close" data-act="closeMenu">Close</button>
    <h1><span class="brandtile" style="width:30px;height:30px;border-radius:8px" id="sideLogo"></span>PowerLock</h1>
    <p class="lead">Clickable HTML prototype of the iOS app as built (SwiftUI, Nov 2026). Tap through it like the real thing, or jump to any screen below.</p>
    <div id="nav"></div>
    <p class="tip">Prototype notes: the session clock runs 60× fast so you can see a full verify. GPS, Screen Time and payments are simulated. Nothing is saved.</p>
  </aside>
  <div class="phone" id="phone">
    <div class="island"></div>
    <div class="status"><span>9:41</span><span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.4l1.2-1.3A10.6 10.6 0 0 0 8 .4 10.6 10.6 0 0 0 .6 3.3l1.2 1.3A8.8 8.8 0 0 1 8 2.2Zm0 3.6c1.4 0 2.7.5 3.6 1.4l1.3-1.3A7 7 0 0 0 8 4a7 7 0 0 0-4.9 1.9l1.3 1.3c.9-.9 2.2-1.4 3.6-1.4Zm0 3.5c-.6 0-1.2.3-1.6.7L8 11.6l1.6-1.6c-.4-.4-1-.7-1.6-.7Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="25" y="4.5" width="1.5" height="4" rx=".7" fill="rgba(255,255,255,.4)"/></svg>
    </span></div>
    <div id="app"></div>
    <div class="homebar"></div>
  </div>
</div>
<button class="menu-btn" data-act="openMenu">Screens</button>

<script>
/* =====================================================================
   Icons (stand-ins for the SF Symbols the app uses)
   ===================================================================== */
const svg = (d, extra='') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${d}</svg>`;
const F = 'fill="currentColor" stroke="none"';
const I = {
  lock: svg(`<rect x="5" y="10.5" width="14" height="10.5" rx="2.6" ${F}/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>`),
  lockOpen: svg(`<rect x="5" y="10.5" width="14" height="10.5" rx="2.6" ${F}/><path d="M8 10.5V8a4 4 0 0 1 7.6-1.8"/>`),
  nav: svg(`<path d="M3.5 11 20.5 3.5 13 20.5 11 13Z" ${F}/>`),
  dumbbell: svg(`<path d="M7 6.5v11M17 6.5v11M3.8 9.5v5M20.2 9.5v5M7 12h10" stroke-width="2.4"/>`),
  chevL: svg(`<path d="M15 5l-7 7 7 7" stroke-width="2.4"/>`),
  chevR: svg(`<path d="M9 5l7 7-7 7" stroke-width="2.4"/>`),

function phases(){
  const w = S.a.weeks || 8;
  const build = ({strength:'Add weight in small steps on the first two lifts of each workout.',muscle:'Add a rep or a little weight each week. Stop each set 1–2 reps short of failure.',fat:'Keep rests short and the pace up. Add weight when the reps get easy.',consistent:'Show up on your days. Add weight only when it feels easy.'})[S.a.goal||'muscle'];
  const lighter = 'Same exercises, about half the sets. Lets your joints and energy catch up.';
  const block = 3; if (w <= block+1) return [[`Weeks 1–${w}`, build]];
  const out=[]; let wk=1; const until = w<=13 ? w : block+1;
  while (wk<=until){ const end=Math.min(wk+block-1,w); out.push([wk===end?`Week ${wk}`:`Weeks ${wk}–${end}`, build]); wk=end+1;
    if (wk<=until && wk<w){ out.push([`Week ${wk}: lighter`, lighter]); wk++; } }
  if (w>13) out.push([`Then repeat to week ${w}`, `${block} weeks building, 1 lighter. Swap a few exercises every 2–3 cycles to keep progressing.`]);
  if (S.a.goal==='strength' && w>=8) out.push(['Last week: test','Work up to a heavy set of 3–5 on your main lifts, with a spotter or safety pins.']);
  return out;
}

  return `<div class="map"><svg viewBox="0 0 350 176" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="350" height="176" fill="#1d2333"/>${lines}${blocks}${labels}

let calcTimer=null;
function runCalc(){
  clearInterval(calcTimer); let pct=0, q=0, hold=0;
  calcTimer = setInterval(()=>{
    if (S.route!=='onb' || ONB[S.onb]!=='years' || S.revealed){ clearInterval(calcTimer); return; }
    if (hold>0){ hold--; return; }
    pct++;
    const el=document.getElementById('calcPct'), rg=document.querySelector('#calcRing .ringfill');
    if (el){ el.textContent = pct+'%'; const c=parseFloat(rg.getAttribute('stroke-dasharray')); rg.setAttribute('stroke-dashoffset', c*(1-pct/100)); }
    if (pct===37||pct===72){ q++; hold=12; const qe=document.getElementById('calcQuote'); if(qe){ qe.classList.remove('typing'); void qe.offsetWidth; qe.classList.add('typing'); qe.textContent=`“${QUOTES[q%3]}”`; } }
    if (pct>=100){ clearInterval(calcTimer); setTimeout(()=>{ S.revealed=true; render(); }, 450); }
  }, 30);
}

function progressTab(){
  const verDays = [], emDays=[5];
  for (let d=1; d<TODAY.date; d++){ const dow=(d-1)%7; if (S.week[dow] && !emDays.includes(d)) verDays.push(d); }
  let cells = 'SMTWTFS'.split('').map(x=>`<span class="h">${x}</span>`).join('');
  for (let d=1; d<=30; d++){ const dow=(d-1)%7; let cls='d';
    if (d<TODAY.date){ if (emDays.includes(d) && S.week[dow]) cls+=' em'; else if (verDays.includes(d)) cls+=' ver'; }
    else if (d===TODAY.date){ cls += S.day==='unlocked'?' ver':S.day==='emergency'?' em':S.week[dow]?' today':''; }
    else if (S.week[dow]) cls+=' train';
    cells += `<span class="${cls}">${d}</span>`; }
  const ws = S.weights, last = ws[ws.length-1], change = (last-ws[0]).toFixed(1);
  const min = Math.min(...ws)-1, max = Math.max(...ws)+1, W=300, H=90;
  const pts = ws.map((v,i)=>[ (i/(ws.length-1))*W, H-((v-min)/(max-min))*H ]);
  const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const histIcon = {key:'key', slider:'sliders', scale:'figure'};
  return `<div style="height:44px"></div><h1 class="t-display">Progress</h1>
    <div class="row g12 mt16" style="align-items:stretch"><div class="card" style="flex:1;padding:16px"><span class="glow">${I.flame}</span><div class="stat mt8">${S.streak}</div><div class="t-foot">sessions in a row</div></div>
      <div class="card" style="flex:1;padding:16px"><span class="glow">${I.seal}</span><div class="stat mt8">85%</div><div class="t-foot">of training days verified</div></div></div>
    <div class="card mt16"><div class="row between"><span class="t-head" style="font-size:19px">November 2026</span><span class="row g8"><button class="circlebtn" style="width:34px;height:34px;font-size:14px;color:var(--glow)" data-act="toast" data-v="Goes back to October.">${I.chevL}</button><button class="circlebtn" style="width:34px;height:34px;font-size:14px;color:var(--ter)">${I.chevR}</button></span></div>
      <div class="cal">${cells}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Verified</span><span><i style="border:1.5px dashed var(--glow)"></i>Emergency</span><span><i style="background:var(--sunken)"></i>Missed</span></div></div>
    <div class="card mt16"><div class="row between" style="align-items:flex-start"><div><div class="t-sub">Bodyweight</div><div class="row g8" style="align-items:baseline"><span class="stat" style="font-size:40px">${last.toFixed(1)}</span><span class="t-sub">lb</span></div>
      <div class="t-foot">${Math.abs(change)<0.05?`Steady over ${ws.length-1} weeks`:`${change>0?'Up':'Down'} ${Math.abs(change)} lb over ${ws.length-1} weeks`}</div></div>
      <button class="pill glow" style="font-size:16px;padding:9px 14px" data-act="openWeigh">${I.plus} Log</button></div>
      <svg viewBox="-6 -8 312 110" width="100%" height="120" class="mt16"><path d="${path}" fill="none" stroke="var(--glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#000" stroke="var(--glow)" stroke-width="2.5"/>`).join('')}</svg>
      <p class="t-foot mt8">Log your weight once a week, same time of day. PowerLock tracks the trend; it can't promise a result.</p></div>
    <div class="secthead"><span class="t-heading">Unlocks and rule changes</span></div>
    <div class="group">${S.history.slice().reverse().map(h=>`<div class="lrow" style="--inset:66px;align-items:flex-start"><span class="icotile wash">${I[histIcon[h.icon]||'list']}</span><span class="tx"><b>${h.title}</b><small>${h.detail}</small></span><span class="t-foot">${h.date}</span></div>`).join('')}</div>`;
}

const pad = n => String(n).padStart(2,'0');
const clock = s => `${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}`;
function renderSession(){
  const s = S.sess, w = todayWorkout() || 'Session', ex = WORKOUTS[w] ? WORKOUTS[w].ex : [];
  const nav = `<div class="pad-top" style="height:50px"></div><div class="navbar"><button class="back" data-act="closeSession">${I.chevL}</button><div class="ttl">${w}</div></div>`;
  if (s.state==='away') return `<div class="view">${nav}<div class="scroll"><div class="card mt8" style="text-align:center;padding:36px 22px">
      <span class="icotile wash" style="width:56px;height:56px;font-size:24px;margin:0 auto">${I.pinSlash}</span>

      <div class="stack g12 mt20"><button class="btn primary" data-act="sessTry">Try again</button><button class="btn secondary" data-act="toast" data-v="Pick a nearby gym for today only. Your home gym stays the same.">I'm at a different gym</button></div></div></div>`;
  const ver = s.state==='verified', paused = s.state==='paused';
  const done = ver ? ex.length : s.done.size;
  const ringHTML = ver
    ? `<div class="ringwrap">${ring(300,12,1)}<div class="verified-disc"><span style="font-size:68px;color:#fff">${I.check}</span><span style="font-size:24px;font-weight:600">Verified</span></div></div>`
    : `<div class="ringwrap" id="sessRing">${ring(300,12,s.secs/(target()*60))}<div class="mid"><div class="clock" id="sessClock">${clock(s.secs)}</div><div class="t-sub mt8" style="font-size:16px">of ${target()} min verified</div></div></div>`;
  const status = ver
    ? `<div style="text-align:center" class="mt16"><div class="glow t-head" style="font-size:19px">${I.lockOpen} Apps unlocked</div><div class="t-sub mt8">${target()} min at ${gymName()}. They stay open for the rest of today.</div></div>`

    : `<div style="text-align:center" class="mt16"><div class="t-head" style="font-size:19px"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--glow);margin-right:6px;vertical-align:2px"></span>At ${gymName()}</div><div class="t-foot">GPS accurate to 15 m · counting</div></div>`;
  const pausedCard = paused ? `<div class="card mt16"><div class="row g12"><span class="icotile wash">${I.locSlash}</span><span><span class="t-head" style="display:block;font-size:18px">Can't find you at the gym</span><span class="t-sub">Your verified minutes are safe.</span></span></div>
      <p class="t-sub mt12" style="font-size:16px;line-height:22px">GPS can struggle indoors or in a basement. Step near a window or the entrance for a minute. If you're really here and it still won't count, don't let it ruin your day.</p>
      <button class="btn secondary mt12" data-act="gpsUnlock">Unlock for today</button><button class="btn quiet" data-act="toast" data-v="Opens a problem report with diagnostics attached.">Report a problem</button></div>` : '';
  const stats = `<div class="stat3 mt20" style="text-align:center"><div><span class="v" style="font-size:22px">${s.start}</span><span class="l">Started</span></div><div><span class="v" style="font-size:22px">${target()} min</span><span class="l">Target</span></div><div><span class="v" style="font-size:22px">${ver?S.streak:`${S.streak} → ${S.streak+1}`}</span><span class="l">Streak</span></div></div>`;
  const list = `<div class="secthead"><span class="t-heading">Workout</span><span class="t-sub">${done} of ${ex.length}</span></div>
    <div class="group">${ex.map((e,i)=>{ const d = ver || s.done.has(i); return `<button class="exrow ${d?'done':''}" data-act="tick" data-v="${i}">${mark(d)}<span><b>${e.n}</b><small>${e.sets} · ${e.rest} · ${e.start}</small></span></button>`; }).join('')}</div>`;
  return `<div class="view">${nav}<div class="scroll" data-scroll>${ringHTML}${status}${pausedCard}${stats}${list}<div style="height:120px"></div></div>
    <div class="foot">${ver?`<button class="btn primary" data-act="sessDone">Done</button>`:`<button class="btn secondary" data-act="endSession">End session</button>`}</div></div>`;
}
let sessTimer=null;
function startSessTimer(){
  clearInterval(sessTimer);
  sessTimer = setInterval(()=>{
    const s=S.sess; if (!s || S.route!=='session' || s.state!=='running'){ return; }
    s.secs += 6; // 60× speed
    if (s.secs >= target()*60){ s.secs = target()*60; s.state='verified'; S.day='unlocked'; S.streak++; render(); return; }
    const c=document.getElementById('sessClock'), r=document.querySelector('#sessRing .ringfill');
    if (c){ c.textContent=clock(s.secs); const len=parseFloat(r.getAttribute('stroke-dasharray')); r.setAttribute('stroke-dashoffset', len*(1-s.secs/(target()*60))); }
  }, 100);
}
function newSession(state='running', secs=0){
  const d=new Date(); let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12||12;
  S.sess = {state, secs, done:new Set(), start:`${h}:${pad(m)} ${ap}`};
}

const emHead = () => `<div class="navbar" style="margin-top:6px"><button class="pillbtn" data-act="closeSheet">Close</button><div class="ttl">Emergency unlock</div></div>`;
let emTimer=null;
function runCountdown(){
  clearInterval(emTimer);
  emTimer = setInterval(()=>{
    if (S.sheet!=='emergency' || S.countdown<=0){ clearInterval(emTimer); return; }
    S.countdown = Math.max(S.countdown-1, -1); // demo: 6× faster than the real minute
    const rem = Math.max(S.countdown,0);
    const n=document.getElementById('emNum'), r=document.querySelector('#emRing .ringfill'), b=document.getElementById('emUnlock'), t=document.getElementById('emTitle');
    if (n){ n.textContent=rem; const len=parseFloat(r.getAttribute('stroke-dasharray')); r.setAttribute('stroke-dashoffset', len*(rem/60));
      b.textContent = rem>0?`Unlock in ${rem}s`:'Unlock for today'; b.disabled = rem>0; t.textContent = rem>0?'Take a minute.':'Still want to unlock?'; }
    if (S.countdown<=0){ S.countdown=-1; clearInterval(emTimer); }
  }, 1000/6);
}

/* =====================================================================
   Actions
   ===================================================================== */
const A = {
  onbNext(){ if (!onbCanContinue()) return;
    if (S.onb===ONB.length-1){ S.route='paywall'; render(); return; }
    S.onb++; render(); },
  onbBack(){ if (S.onb>0){ S.onb--; if (ONB[S.onb]==='years') S.revealed=true; render(); } },
  pick(el){ const k=el.dataset.k; S.a[k] = el.dataset.num ? Number(el.dataset.v) : el.dataset.v; if (k==='equip' && el.dataset.v==='gym') S.a.pullup=false; render(); },
  togglePullup(){ S.a.pullup=!S.a.pullup; render(); },
  pickPlan(el){ S.planIdx=Number(el.dataset.v); S.week={...PLANS[S.planIdx].week}; render(); },
  toggleDay(el){ const d=Number(el.dataset.v);
    if (S.week[d]){ if (Object.keys(S.week).length<=1){ toast('The minimum is one day a week.'); return; } delete S.week[d]; }
    else { const names=[...new Set(Object.values(PLANS[S.planIdx].week))]; const used=Object.values(S.week); S.week[d]=names.find(n=>!used.includes(n))||names[0]; }
    render(); },
  resetWeek(){ S.week={...PLANS[S.planIdx].week}; render(); },
  pickGym(el){ S.gym=Number(el.dataset.v); render(); },
  changeApps(){ S.apps = S.apps>=6?2:S.apps+1; toast("On iPhone this opens Apple's Screen Time app picker."); render(); },
  setAllow(el){ S.allow=Number(el.dataset.v); render(); },
  cycleAllow(){ S.allow = S.allow>=3?1:S.allow+1; render(); },
  allowNotif(){ S.notif=true; render(); },
  payPlan(el){ S.payPlan=el.dataset.v; render(); },
  subscribe(){ S.route='main'; S.tab='today'; S.day = todayWorkout()?'locked':'rest'; render(); },
  tab(el){ S.tab=el.dataset.v; S.route='main'; render(); const sc=document.querySelector('[data-scroll]'); if(sc) sc.scrollTop=0; },
  openSettings(){ S.sheet='settings'; render(); },
  openEmergency(){ S.sheet='emergency'; S.reason=''; S.countdown=0; render(); },
  openWeigh(){ S.sheet='weigh'; render(); },
  closeSheet(){ S.sheet=null; clearInterval(emTimer); render(); },
  emContinue(){ if(!S.reason.trim()) return; S.countdown=60; render(); runCountdown(); },
  emUnlock(){ S.emUsed++; S.day='emergency'; S.history.push({icon:'key',title:'Emergency unlock',detail:S.reason.trim()||'No reason given.',date:'Nov 14'}); S.sheet=null; S.route='main'; S.tab='today'; render(); },
  saveWeigh(){ const v=parseFloat(document.getElementById('weighIn').value); if (v>=50&&v<=700){ S.weights.push(v); if (S.weights.length>6) S.weights.shift(); } S.sheet=null; render(); },
  askReset(){ S.sheet='reset'; render(); },
  doReset(){ S = fresh(); render(); },
  previewShield(){ S.sheet=null; S.route='shield'; render(); },
  shieldOK(){ S.route='main'; render(); },
  shieldGym(){ A.startSession(); },
  startSession(){
    if (!todayWorkout()){ toast('Today is a rest day.'); return; }
    if (S.day==='unlocked') newSession('verified', target()*60);
    else if (!S.sess || S.sess.state==='verified') newSession();
    S.route='session'; render(); startSessTimer(); },
  sessTry(){ S.sess.state='running'; render(); startSessTimer(); },
  closeSession(){ S.route='main'; S.tab='today'; render(); },
  endSession(){ if (confirm('End this session? Your verified minutes are kept, but your apps stay locked until you reach the target.')){ S.route='main'; render(); } },
  sessDone(){ S.route='main'; S.tab='today'; render(); },
  gpsUnlock(){ S.day='emergency'; S.history.push({icon:'key',title:'GPS unlock',detail:"Couldn't verify at the gym. Didn't use an emergency unlock.",date:'Nov 14'}); S.route='main'; S.tab='today'; render(); },
  tick(el){ const i=Number(el.dataset.v); if (S.sess.state==='verified') return; S.sess.done.has(i)?S.sess.done.delete(i):S.sess.done.add(i); render(); },
  openWorkout(el){ S.workoutName=el.dataset.v; S.prevRoute=S.route; S.route='workout'; render(); },
  closeWorkout(){ S.route='main'; render(); },
  swap(el){ const w=el.dataset.w, i=Number(el.dataset.i), e=WORKOUTS[w].ex[i]; const alts=SWAPS[e.n];
    if (!alts){ toast('No swap for this one in the prototype.'); return; }
    const next = alts[0]; SWAPS[next] = [...alts.slice(1), e.n]; toast(`Swapped ${e.n} for ${next}.`); e.n = next; render(); },
  toast(el){ toast(el.dataset.v); },
  openMenu(){ document.getElementById('side').classList.add('open'); },
  closeMenu(){ document.getElementById('side').classList.remove('open'); },
  jump(el){ JUMPS[el.dataset.v](); render(); document.getElementById('side').classList.remove('open'); },
};

/* Screen list for jumping around */
function seedAnswers(){ Object.assign(S.a,{age:'18-24',gender:'male',weight:'170',goal:'muscle',weeks:8,exp:'1-3',equip:'gym',screen:'4'}); }
function toMain(day, tab='today'){ seedAnswers(); S.route='main'; S.tab=tab; S.day=day; S.sheet=null; S.revealed=true; }
const JUMPS = {};
const NAV = [
  ['Onboarding', ONB.map((p,i)=>[`onb${i}`, ['Intro: earn screen time','Age','Gender','Bodyweight','Goal','Goal length','Experience','Equipment','Screen time','Calculating → years','Pick your plan','Set your week','Where you train','Apps to lock','Set your day','Free trial'][i], ()=>{ if(i>1) seedAnswers(); S.route='onb'; S.onb=i; S.sheet=null; S.revealed = false; S.demoStep=0; }])],
  ['Paywall', [['pay','Keep your word', ()=>{ seedAnswers(); S.route='paywall'; S.sheet=null; }]]],
  ['Today', [['tLocked','Locked',()=>toMain('locked')],['tUnlocked','Unlocked (verified)',()=>{ toMain('unlocked'); newSession('verified',3600); }],['tRest','Rest day',()=>toMain('rest')],['tEm','Emergency unlock used',()=>toMain('emergency')]]],
  ['Session', [['sAway','Not at the gym',()=>{ toMain('locked'); newSession('away'); S.route='session'; }],['sRun','Running',()=>{ toMain('locked'); newSession('running', 27*60+39); S.sess.done=new Set([0,1]); S.route='session'; startSessTimer(); }],['sPause','Paused (GPS lost)',()=>{ toMain('locked'); newSession('paused',18*60); S.sess.done=new Set([0]); S.route='session'; }],['sVer','Verified',()=>{ toMain('unlocked'); newSession('verified',3600); S.route='session'; }]]],
  ['Plan', [['plan','Plan tab',()=>toMain('locked','plan')],['work','Workout: Lower B',()=>{ toMain('locked','plan'); S.workoutName='Lower B'; S.route='workout'; }]]],
  ['Progress', [['prog','Progress tab',()=>toMain('locked','progress')]]],
  ['Sheets', [['set','Settings',()=>{ toMain('locked'); S.sheet='settings'; }],['em','Emergency unlock',()=>{ toMain('locked'); S.sheet='emergency'; S.reason=''; S.countdown=0; }],['emw','Emergency unlock: wait',()=>{ toMain('locked'); S.sheet='emergency'; S.reason='Sick day, staying home.'; S.countdown=60; setTimeout(runCountdown,0); }],['shield','Lock screen (Screen Time)',()=>{ toMain('locked'); S.route='shield'; }]]],
];
NAV.forEach(([,items])=>items.forEach(([id,,fn])=>JUMPS[id]=fn));
function currentNavId(){
  if (S.sheet==='settings') return 'set';
  if (S.sheet==='emergency') return S.countdown!==0?'emw':'em';
  if (S.route==='onb') return 'onb'+S.onb;
  if (S.route==='paywall') return 'pay';
  if (S.route==='shield') return 'shield';
  if (S.route==='workout') return 'work';
  if (S.route==='session') return ({away:'sAway',running:'sRun',paused:'sPause',verified:'sVer'})[S.sess.state];
  if (S.route==='main') return S.tab==='plan'?'plan':S.tab==='progress'?'prog':({locked:'tLocked',unlocked:'tUnlocked',rest:'tRest',emergency:'tEm'})[S.day];
}
function renderNav(){
  const cur = currentNavId();
  document.getElementById('nav').innerHTML = NAV.map(([sec,items])=>`<h2>${sec}</h2><div class="nav">${items.map(([id,l])=>`<button class="${id===cur?'on':''}" data-act="jump" data-v="${id}">${l}</button>`).join('')}</div>`).join('');
}

/* =====================================================================
   Render loop
   ===================================================================== */
let lastKey='';
function render(){
  const app = document.getElementById('app');
  const sc = app.querySelector('[data-scroll]'), keep = sc ? sc.scrollTop : 0;
  const key = [S.route,S.onb,S.tab,S.sheet,S.workoutName].join('|');
  let html = '';
  if (S.route==='onb') html = renderOnb();
  else if (S.route==='paywall') html = renderPaywall();
  else if (S.route==='main') html = renderMain();
  else if (S.route==='session') html = renderSession();
  else if (S.route==='workout') html = renderWorkout();
  else if (S.route==='shield') html = renderShield();
  if (S.sheet) html += renderSheet();
  app.innerHTML = html;
  if (key===lastKey){ const ns = app.querySelector('.view [data-scroll]'); if (ns) ns.scrollTop = keep; }
  lastKey = key;
  if (S.route==='onb' && ONB[S.onb]==='years' && !S.revealed) runCalc();
  if (S.route==='onb' && S.onb===0) runValueDemo();
  renderNav();
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('input', e=>{
  if (e.target.id==='weightIn'){ S.a.weight = e.target.value.replace(/[^0-9.]/g,''); const ok=onbCanContinue();
    document.getElementById('onbNext').disabled=!ok; document.getElementById('weightErr').style.display=ok?'none':'block'; }
  if (e.target.id==='reasonIn'){ S.reason=e.target.value; document.getElementById('emContinue').disabled = !S.reason.trim(); }
});
document.addEventListener('change', e=>{ const t=e.target.dataset.time; if (t && e.target.value){ S[t]=e.target.value; } });
document.getElementById('sideLogo').innerHTML = `<div style="width:19px;height:13px">${brandMark()}</div>`;
render();
</script>
</body>
</html>
