name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/Packages/GPSGymCore

  ios-build:
    name: iOS app build (Simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project GPSGym.xcodeproj \
            -scheme GPSGym \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

