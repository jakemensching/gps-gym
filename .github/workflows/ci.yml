name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path ios/Packages/GPSGymCore

  ios-build:
    name: iOS app build (Simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project GPSGym.xcodeproj \
            -scheme GPSGym \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

  web:
    name: Web app (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
